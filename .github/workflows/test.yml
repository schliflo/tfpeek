name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: docker run -d -p 4443:4443 fsouza/fake-gcs-server -scheme http -backend memory
      - run: npm test
        env:
          STORAGE_EMULATOR_HOST: http://localhost:4443/storage/v1
